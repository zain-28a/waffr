name: Backend checks

# Tests, static analysis and a dependency audit for backend/.
# Needs no repository secrets: the database is a throwaway service container,
# and the app's own secrets are test values set below.

on:
  push:
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      # Row security must apply, so the tests connect as an owner role that
      # is neither superuser nor BYPASSRLS (see backend/tests/conftest.py).
      TEST_DATABASE_URL: postgresql://waffr_test:waffr_test@localhost:5432/waffer_test
      SECRET_KEY: ci-only-test-secret-not-used-anywhere-else-0123456789

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install ruff==0.17.6 bandit==1.9.4 pip-audit==2.10.1

      - name: Test database
        run: |
          psql -c "CREATE ROLE waffr_test LOGIN PASSWORD 'waffr_test' NOSUPERUSER NOBYPASSRLS"
          psql -c "CREATE DATABASE waffer_test OWNER waffr_test"

      - name: Tests
        run: python -m pytest -q -p no:cacheprovider

      - name: Ruff (errors only)
        run: ruff check --select E9,F63,F7,F401,F811,F841 .

      - name: Bandit (medium and high)
        run: bandit -q -r . -x ./tests --severity-level medium --confidence-level medium

      - name: Dependency audit
        run: pip-audit -r requirements.txt --strict
