# Builds a release APK for testing and attaches it to the run as an artifact.
# Runs on every push to main, and on demand from the Actions tab.
name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      # The committed wrapper points at a local Windows zip; CI downloads it.
      - name: Use the public Gradle distribution
        run: |
          sed -i 's#^distributionUrl=.*#distributionUrl=https\\://services.gradle.org/distributions/gradle-9.3.1-all.zip#' \
            android/gradle/wrapper/gradle-wrapper.properties

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: waffr-apk-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/Waffr-*.apk
          if-no-files-found: error
          retention-days: 30
