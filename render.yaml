databases:
  - name: waffer-db
    plan: free
    databaseName: waffer

services:
  - type: web
    name: waffer-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: waffer-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
