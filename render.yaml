databases:
  - name: waffer-db
    plan: free
    databaseName: waffer

services:
  - type: web
    name: waffer-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: waffer-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      # Password reset emails. Fill these in on Render (for Gmail:
      # smtp.gmail.com, port 587, and an app password).
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
